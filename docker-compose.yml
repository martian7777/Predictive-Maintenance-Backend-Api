services:
  db:
    image: postgres:16-alpine
    container_name: pm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmpassword}
      POSTGRES_DB: ${POSTGRES_DB:-predictive_maintenance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmuser} -d ${POSTGRES_DB:-predictive_maintenance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    container_name: pm_api
    env_file: .env
    environment:
      POSTGRES_HOST: db
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pmuser}:${POSTGRES_PASSWORD:-pmpassword}@db:5432/${POSTGRES_DB:-predictive_maintenance}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - model_store:/app/models
    # Run migrations then launch the server.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      target: frontend
    container_name: pm_frontend
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-7860}:7860"

volumes:
  pgdata:
  model_store:
